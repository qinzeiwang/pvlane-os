name: Bug report / 错误报告
description: Report a reproducible PVLANE problem / 报告可复现的 PVLANE 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove sensitive project data before submitting. 提交前请移除敏感项目资料。
  - type: input
    id: environment
    attributes:
      label: Environment / 运行环境
      description: OS, browser version, and Node.js version / 操作系统、浏览器版本和 Node.js 版本
      placeholder: Windows 11, Chrome 140, Node.js 22.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 期望结果
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional information / 补充信息
      description: Screenshots or a minimized project file with no sensitive data / 截图或不含敏感资料的最小项目文件
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I have removed data that I am not authorized to publish. / 我已移除无权公开的数据。
          required: true
